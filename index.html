<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AMD Driver Watch</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 p-8 font-sans">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-bold tracking-tight">AMD Radeon Driver Watch</h1>
            <p class="text-gray-400 text-sm mt-1">A lightweight tracker for recent AMD graphics software releases.</p>
        </header>

        <div class="bg-gray-800 rounded-xl shadow-lg overflow-hidden border border-gray-700">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-700/50 text-gray-300 text-xs uppercase tracking-wider border-b border-gray-700">
                        <th class="p-4 font-semibold">Version</th>
                        <th class="p-4 font-semibold">Release Date</th>
                        <th class="p-4 font-semibold">Type</th>
                        <th class="p-4 font-semibold text-right">Details</th>
                    </tr>
                </thead>
                <tbody id="driver-table-body" class="divide-y divide-gray-700 text-sm">
                    <tr>
                        <td colspan="4" class="p-6 text-center text-gray-400">Loading AMD drivers...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Fetch the local drivers.json file
        fetch('drivers.json')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('driver-table-body');
                tbody.innerHTML = ''; // Clear loading text

                // Loop through the amd array from our json file
                data.amd.forEach(driver => {
                    let row = document.createElement('tr');
                    row.className = 'hover:bg-gray-700/30 transition-colors';
                    
                    row.innerHTML = `
                        <td class="p-4 font-medium text-white">${driver.version}</td>
                        <td class="p-4 text-gray-300">${driver.date}</td>
                        <td class="p-4">
                            <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${driver.type === 'Recommended' ? 'bg-emerald-900/50 text-emerald-400 border border-emerald-700/50' : 'bg-blue-900/50 text-blue-400 border border-blue-700/50'}">
                                ${driver.type}
                            </span>
                        </td>
                        <td class="p-4 text-right">
                            <a href="${driver.url}" target="_blank" class="text-indigo-400 hover:text-indigo-300 font-medium underline">Release Notes</a>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            })
            .catch(err => {
                document.getElementById('driver-table-body').innerHTML = `<tr><td colspan="4" class="p-6 text-center text-red-400">Error loading driver data.</td></tr>`;
            });
    </script>
</body>
</html>
