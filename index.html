<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AMD Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-6 font-sans">
    <div class="max-w-6xl mx-auto space-y-8">
        
        <div class="border-b border-slate-800 pb-4">
            <h1 class="text-3xl font-bold tracking-tight">AMD Tracker</h1>
            <p class="text-slate-400 text-sm mt-1">A bug tracker using AMD's driver notes.</p>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-sm">
            <h2 class="text-xl font-semibold text-slate-200 mb-1">Bugs Per Driver</h2>
            <p class="text-slate-400 text-sm mb-4">(Positive = Fixed Issues, Negative = Open / Known Issues)</p>
            
            <div class="relative h-[450px] w-full">
                <canvas id="bugLifecycleChart"></canvas>
            </div>
        </div>
            
        <div class="space-y-6">
            <h2 class="text-xl font-semibold text-slate-200 border-b border-slate-800 pb-2">Issues/Fixes by version (most recent first)</h2>
            <div id="driver-tracker" class="space-y-4 max-h-[800px] overflow-y-auto pr-2"></div>
        </div>

    </div>

    <script>
        fetch('./drivers.json')
            .then(response => {
                if (!response.ok) throw new Error('Failed to load drivers.json');
                return response.json();
            })
            .then(data => {
                const driverContainer = document.getElementById('driver-tracker');
                
                driverContainer.innerHTML = '';

                data.drivers.forEach((d) => {
                    let card = document.createElement('div');
                    card.className = 'bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-sm space-y-4';
                    
                    let fixedHtml = (d.fixed_bug_ids || []).filter(id => data.master_bugs[id]?.trim()).map(id => `
                        <li class="text-emerald-400 text-xs mb-1 flex items-center gap-2">
                            <span class="bg-emerald-950 px-1.5 py-0.5 rounded border border-emerald-800/50 font-mono text-[10px]">${id}</span>
                            <span>${data.master_bugs[id]}</span>
                        </li>
                    `).join('');

                    let knownHtml = (d.known_bug_ids || []).filter(id => data.master_bugs[id]?.trim()).map(id => `
                        <li class="text-amber-400 text-xs mb-1 flex items-center gap-2">
                            <span class="bg-amber-950 px-1.5 py-0.5 rounded border border-amber-800/50 font-mono text-[10px]">${id}</span>
                            <span>${data.master_bugs[id]}</span>
                        </li>
                    `).join('');

                    card.innerHTML = `
                        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                            <div>
                                <span class="text-xl font-bold text-white">${d.version}</span>
                            </div>
                            <div class="text-right">
                                <span class="text-slate-400 text-xs block">${d.date || ''}</span>
                                <a href="${d.url}" target="_blank" class="text-indigo-400 hover:underline text-xs">Release Notes</a>
                            </div>
                        </div>
                        
                        <div class="grid sm:grid-cols-2 gap-3">
                            <div class="bg-slate-950/50 p-3 rounded border border-slate-800/50">
                                <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-500 block mb-2">Fixed in this version</span>
                                <ul class="list-none pl-0">${fixedHtml || '<span class="text-slate-600 text-xs">None</span>'}</ul>
                            </div>
                            <div class="bg-slate-950/50 p-3 rounded border border-slate-800/50">
                                <span class="text-[10px] font-bold uppercase tracking-wider text-amber-500 block mb-2">Known / Open Issues</span>
                                <ul class="list-none pl-0">${knownHtml || '<span class="text-slate-600 text-xs">None</span>'}</ul>
                            </div>
                        </div>
                    `;
                    driverContainer.appendChild(card);
                });

                const chronologicalDrivers = [...data.drivers].reverse();
                
                const driverVersions = chronologicalDrivers.map(d => d.version);
                const fixedCounts = chronologicalDrivers.map(d => (d.fixed_bug_ids || []).length);
                const knownCounts = chronologicalDrivers.map(d => -Math.abs((d.known_bug_ids || []).length));

                const ctx = document.getElementById('bugLifecycleChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: driverVersions,
                        datasets: [
                            {
                                label: 'Fixed Issues',
                                data: fixedCounts,
                                borderColor: '#10b981',
                                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                borderWidth: 2,
                                pointBackgroundColor: '#10b981',
                                pointRadius: 4,
                                fill: true,
                                tension: 0.1
                            },
                            {
                                label: 'Open / Known Issues',
                                data: knownCounts,
                                borderColor: '#f59e0b',
                                backgroundColor: 'rgba(245, 158, 11, 0.1)',
                                borderWidth: 2,
                                pointBackgroundColor: '#f59e0b',
                                pointRadius: 4,
                                fill: true,
                                tension: 0.1
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: {
                                ticks: { color: '#94a3b8', font: { family: 'monospace', size: 12 } },
                                grid: { color: '#1e293b' }
                            },
                            y: {
                                beginAtZero: true,
                                ticks: { 
                                    color: '#94a3b8', 
                                    font: { family: 'monospace', size: 12 }, 
                                    precision: 0,
                                    callback: function(value) {
                                        return Math.abs(value);
                                    }
                                },
                                grid: { 
                                    color: function(context) {
                                        if (context.tick.value === 0) {
                                            return '#475569';
                                        }
                                        return '#1e293b';
                                    },
                                    lineWidth: function(context) {
                                        return context.tick.value === 0 ? 2 : 1;
                                    }
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top',
                                labels: { color: '#94a3b8', font: { family: 'sans-serif', size: 12 } }
                            },
                            tooltip: {
                                callbacks: {
                                    title: function(context) {
                                        return `Driver Version: ${context[0].label}`;
                                    },
                                    label: function(context) {
                                        let label = context.dataset.label || '';
                                        let value = Math.abs(context.parsed.y);
                                        return ` ${label}: ${value}`;
                                    }
                                }
                            }
                        }
                    }
                });
            })
            .catch(error => console.error('Error loading driver tracker data:', error));
    </script>
</body>
</html>
