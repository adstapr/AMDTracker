<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Driver Watch Baseline</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-6 font-sans">
    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- Header -->
        <div class="border-b border-slate-800 pb-4">
            <h1 class="text-3xl font-bold tracking-tight">GPU Driver & Bug Watch</h1>
            <p class="text-slate-400 text-sm mt-1">Manual issue lifecycle tracker mapped by version and bug ID.</p>
        </div>

        <div class="grid lg:grid-cols-2 gap-8">
            
            <!-- SECTION 1: Issues Grouped by Driver Version -->
            <div class="space-y-6">
                <h2 class="text-xl font-semibold text-slate-200 border-b border-slate-800 pb-2">Issues by Driver Version</h2>
                <div id="driver-tracker" class="space-y-4">
                    <div class="text-slate-500 text-sm">Loading drivers...</div>
                </div>
            </div>

            <!-- SECTION 2: Master Bug Ledger (Lifecycle tracking) -->
            <div class="space-y-6">
                <h2 class="text-xl font-semibold text-slate-200 border-b border-slate-800 pb-2">Master Bug Ledger</h2>
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-sm">
                    <div id="bug-ledger" class="space-y-3">
                        <div class="text-slate-500 text-sm">Loading bugs...</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        fetch('drivers.json')
            .then(res => res.json())
            .then(data => {
                const driverContainer = document.getElementById('driver-tracker');
                const bugContainer = document.getElementById('bug-ledger');
                
                driverContainer.innerHTML = '';
                bugContainer.innerHTML = '';

                // 1. Render Driver Versions & Their Fixed/Known Bugs
                data.drivers.forEach(d => {
                    let card = document.createElement('div');
                    card.className = 'bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-sm space-y-4';
                    
                    let fixedHtml = d.fixed_bug_ids.map(id => `
                        <li class="text-emerald-400 text-xs mb-1 flex items-center gap-2">
                            <span class="bg-emerald-950 px-1.5 py-0.5 rounded border border-emerald-800/50 font-mono text-[10px]">${id}</span>
                            <span>${data.master_bugs[id] || id}</span>
                        </li>
                    `).join('');

                    let knownHtml = d.known_bug_ids.map(id => `
                        <li class="text-amber-400 text-xs mb-1 flex items-center gap-2">
                            <span class="bg-amber-950 px-1.5 py-0.5 rounded border border-amber-800/50 font-mono text-[10px]">${id}</span>
                            <span>${data.master_bugs[id] || id}</span>
                        </li>
                    `).join('');

                    card.innerHTML = `
                        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                            <div>
                                <span class="text-xl font-bold text-white">${d.version}</span>
                                <span class="ml-2 px-2 py-0.5 rounded text-[10px] font-semibold ${d.type === 'Recommended' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-blue-950 text-blue-400 border border-blue-800'}">${d.type}</span>
                            </div>
                            <div class="text-right">
                                <span class="text-slate-400 text-xs block">${d.date}</span>
                                <a href="${d.url}" target="_blank" class="text-indigo-400 hover:underline text-xs">Release Notes</a>
                            </div>
                        </div>
                        
                        <div class="grid sm:grid-cols-2 gap-3">
                            <div class="bg-slate-950/50 p-3 rounded border border-slate-800/50">
                                <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-500 block mb-2">Fixed in this version</span>
                                <ul class="list-none pl-0">${fixedHtml || '<span class="text-slate-600 text-xs">None</span>'}</ul>
                            </div>
                            <div class="bg-slate-950/50 p-3 rounded border border-slate-800/50">
                                <span class="text-[10px] font-bold uppercase tracking-wider text-amber-500 block mb-2">Known / Open Issues</span>
                                <ul class="list-none pl-0">${knownHtml || '<span class="text-slate-600 text-xs">None</span>'}</ul>
                            </div>
                        </div>
                    `;
                    driverContainer.appendChild(card);
                });

                // 2. Render Master Bug Ledger
                for (const [id, description] of Object.entries(data.master_bugs)) {
                    // Check status across drivers
                    let isFixedAnywhere = data.drivers.some(d => d.fixed_bug_ids.includes(id));
                    let isKnownCurrent = data.drivers[0]?.known_bug_ids.includes(id); // latest driver check

                    let badgeColor = isKnownCurrent ? 'bg-amber-950 text-amber-400 border-amber-800' : 'bg-emerald-950 text-emerald-400 border-emerald-800';
                    let statusText = isKnownCurrent ? 'Open / Pending' : 'Resolved';

                    let bugRow = document.createElement('div');
                    bugRow.className = 'flex items-start justify-between gap-4 py-2 border-b border-slate-800/60 text-xs last:border-0';
                    bugRow.innerHTML = `
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="font-mono font-semibold text-slate-300">${id}</span>
                                <span class="px-1.5 py-0.5 rounded text-[10px] border ${badgeColor}">${statusText}</span>
                            </div>
                            <p class="text-slate-400">${description}</p>
                        </div>
                    `;
                    bugContainer.appendChild(bugRow);
                }
            });
    </script>
</body>
</html>
