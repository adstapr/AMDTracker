<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AMD Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-6 font-sans">
    <div class="max-w-6xl mx-auto space-y-8">
        
        <div class="border-b border-slate-800 pb-4">
            <h1 class="text-3xl font-bold tracking-tight">AMD Tracker</h1>
            <p class="text-slate-400 text-sm mt-1">A bug tracker using AMD's driver notes.</p>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-sm">
                <span class="text-slate-400 text-xs font-medium uppercase tracking-wider block mb-1">Total Drivers</span>
                <span id="stat-total-drivers" class="text-2xl font-bold text-white">0</span>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-sm">
                <span class="text-slate-400 text-xs font-medium uppercase tracking-wider block mb-1">Total Unique Issues</span>
                <span id="stat-total-issues" class="text-2xl font-bold text-indigo-400">0</span>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-sm">
                <span class="text-slate-400 text-xs font-medium uppercase tracking-wider block mb-1">Overall Fix Rate</span>
                <span id="stat-fix-rate" class="text-2xl font-bold text-emerald-400">0%</span>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-sm">
                <span class="text-slate-400 text-xs font-medium uppercase tracking-wider block mb-1">Active Open Issues</span>
                <span id="stat-open-issues" class="text-2xl font-bold text-amber-400">0</span>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-sm space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div>
                    <h2 class="text-xl font-semibold text-slate-200 mb-1">Bugs Per Driver</h2>
                    <p class="text-slate-400 text-sm">(Positive = Fixed Issues, Negative = Open / Known Issues)</p>
                </div>
                <label class="flex items-center gap-2.5 text-xs text-slate-300 cursor-pointer select-none bg-slate-950 px-3 py-2 rounded-lg border border-slate-800">
                    <input type="checkbox" id="excludeDuplicatesToggle" checked class="rounded border-slate-700 bg-slate-900 text-indigo-600 focus:ring-indigo-500 w-4 h-4">
                    <span>Exclude duplicate known issues</span>
                </label>
            </div>
            
            <div class="relative h-[450px] w-full">
                <canvas id="bugLifecycleChart"></canvas>
            </div>
        </div>
            
        <div class="space-y-6">
            <h2 class="text-xl font-semibold text-slate-200 border-b border-slate-800 pb-2">Issues/Fixes by version (most recent first)</h2>
            <div id="driver-tracker" class="space-y-4 max-h-[800px] overflow-y-auto pr-2"></div>
        </div>

    </div>

    <script>
        fetch('./drivers.json')
            .then(response => {
                if (!response.ok) throw new Error('Failed to load drivers.json');
                return response.json();
            })
            .then(data => {
                const driverContainer = document.getElementById('driver-tracker');
                driverContainer.innerHTML = '';

                const totalDrivers = data.drivers.length;
                const totalIssues = data.master_bugs ? Object.keys(data.master_bugs).length : 0;
                
                const allFixedIds = new Set();
                const allKnownIds = new Set();
                data.drivers.forEach(d => {
                    (d.fixed_bug_ids || []).forEach(id => allFixedIds.add(id));
                    (d.known_bug_ids || []).forEach(id => allKnownIds.add(id));
                });
                
                const fixRate = totalIssues > 0 ? Math.round((allFixedIds.size / totalIssues) * 100) : 0;

                let activeOpenCount = 0;
                if (data.drivers.length > 0) {
                    const latestDriver = data.drivers[0];
                    const activeKnown = new Set();

                    [...data.drivers].reverse().forEach(d => {
                        (d.fixed_bug_ids || []).forEach(id => activeKnown.delete(id));
                        (d.known_bug_ids || []).forEach(id => activeKnown.add(id));
                    });
                    activeOpenCount = activeKnown.size;
                }

                document.getElementById('stat-total-drivers').textContent = totalDrivers;
                document.getElementById('stat-total-issues').textContent = totalIssues;
                document.getElementById('stat-fix-rate').textContent = `${fixRate}%`;
                document.getElementById('stat-open-issues').textContent = activeOpenCount;

                data.drivers.forEach((d) => {
                    let card = document.createElement('div');
                    card.className = 'bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-sm space-y-4';
                    
                    let fixedHtml = (d.fixed_bug_ids || []).filter(id => data.master_bugs[id]?.trim()).map(id => `
                        <li class="text-emerald-400 text-xs mb-1 flex items-center gap-2">
                            <span class="bg-emerald-950 px-1.5 py-0.5 rounded border border-emerald-800/50 font-mono text-[10px]">${id}</span>
                            <span>${data.master_bugs[id]}</span>
                        </li>
                    `).join('');

                    let knownHtml = (d.known_bug_ids || []).filter(id => data.master_bugs[id]?.trim()).map(id => `
                        <li class="text-amber-400 text-xs mb-1 flex items-center gap-2">
                            <span class="bg-amber-950 px-1.5 py-0.5 rounded border border-amber-800/50 font-mono text-[10px]">${id}</span>
                            <span>${data.master_bugs[id]}</span>
                        </li>
                    `).join('');

                    card.innerHTML = `
                        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                            <div>
                                <span class="text-xl font-bold text-white">${d.version}</span>
                            </div>
                            <div class="text-right">
                                <span class="text-slate-400 text-xs block">${d.date || ''}</span>
                                <a href="${d.url}" target="_blank" class="text-indigo-400 hover:underline text-xs">Release Notes</a>
                            </div>
                        </div>
                        
                        <div class="grid sm:grid-cols-2 gap-3">
                            <div class="bg-slate-950/50 p-3 rounded border border-slate-800/50">
                                <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-500 block mb-2">Fixed in this version</span>
                                <ul class="list-none pl-0">${fixedHtml || '<span class="text-slate-600 text-xs">None</span>'}</ul>
                            </div>
                            <div class="bg-slate-950/50 p-3 rounded border border-slate-800/50">
                                <span class="text-[10px] font-bold uppercase tracking-wider text-amber-500 block mb-2">Known / Open Issues</span>
                                <ul class="list-none pl-0">${knownHtml || '<span class="text-slate-600 text-xs">None</span>'}</ul>
                            </div>
                        </div>
                    `;
                    driverContainer.appendChild(card);
                });

                let bugChart = null;
                const chronologicalDrivers = [...data.drivers].reverse();
                const driverVersions = chronologicalDrivers.map(d => d.version);
                const fixedCounts = chronologicalDrivers.map(d => (d.fixed_bug_ids || []).length);

                function getKnownCounts(excludeDuplicates) {
                    if (!excludeDuplicates) {
                        return chronologicalDrivers.map(d => -Math.abs((d.known_bug_ids || []).length));
                    }

                    let activeKnown = new Set();
                    return chronologicalDrivers.map(d => {
                        (d.fixed_bug_ids || []).forEach(id => activeKnown.delete(id));
                        
                        let uniqueCount = 0;
                        (d.known_bug_ids || []).forEach(id => {
                            if (!activeKnown.has(id)) {
                                activeKnown.add(id);
                                uniqueCount++;
                            }
                        });
                        return -Math.abs(uniqueCount);
                    });
                }

                function renderChart() {
                    const excludeDuplicates = document.getElementById('excludeDuplicatesToggle').checked;
                    const knownCounts = getKnownCounts(excludeDuplicates);

                    if (bugChart) {
                        bugChart.data.datasets[1].data = knownCounts;
                        bugChart.update();
                        return;
                    }

                    const ctx = document.getElementById('bugLifecycleChart').getContext('2d');
                    bugChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: driverVersions,
                            datasets: [
                                {
                                    label: 'Fixed Issues',
                                    data: fixedCounts,
                                    borderColor: '#10b981',
                                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                    borderWidth: 2,
                                    pointBackgroundColor: '#10b981',
                                    pointRadius: 4,
                                    fill: true,
                                    tension: 0.1
                                },
                                {
                                    label: 'Open / Known Issues',
                                    data: knownCounts,
                                    borderColor: '#f59e0b',
                                    backgroundColor: 'rgba(245, 158, 11, 0.1)',
                                    borderWidth: 2,
                                    pointBackgroundColor: '#f59e0b',
                                    pointRadius: 4,
                                    fill: true,
                                    tension: 0.1
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                x: {
                                    ticks: { color: '#94a3b8', font: { family: 'monospace', size: 12 } },
                                    grid: { color: '#1e293b' }
                                },
                                y: {
                                    beginAtZero: true,
                                    ticks: { 
                                        color: '#94a3b8', 
                                        font: { family: 'monospace', size: 12 }, 
                                        precision: 0,
                                        callback: function(value) {
                                            return Math.abs(value);
                                        }
                                    },
                                    grid: { 
                                        color: function(context) {
                                            if (context.tick.value === 0) {
                                                return '#475569';
                                            }
                                            return '#1e293b';
                                        },
                                        lineWidth: function(context) {
                                            return context.tick.value === 0 ? 2 : 1;
                                        }
                                    }
                                }
                            },
                            plugins: {
                                legend: {
                                    display: true,
                                    position: 'top',
                                    labels: { color: '#94a3b8', font: { family: 'sans-serif', size: 12 } }
                                },
                                tooltip: {
                                    callbacks: {
                                        title: function(context) {
                                            return `Driver Version: ${context[0].label}`;
                                        },
                                        label: function(context) {
                                            let label = context.dataset.label || '';
                                            let value = Math.abs(context.parsed.y);
                                            return ` ${label}: ${value}`;
                                        }
                                    }
                                }
                            }
                        }
                    });
                }

                renderChart();

                document.getElementById('excludeDuplicatesToggle').addEventListener('change', renderChart);
            })
            .catch(error => console.error('Error loading driver tracker data:', error));
    </script>
</body>
</html>
