<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AMD Driver & Bug Watch</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-6 font-sans">
    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- Header -->
        <div class="border-b border-slate-800 pb-4">
            <h1 class="text-3xl font-bold tracking-tight">AMD Driver & Bug Watch</h1>
            <p class="text-slate-400 text-sm mt-1">Manual issue lifecycle tracker mapped by version and bug ID.</p>
        </div>

        <!-- SECTION 3: Visual Bug Lifecycle Graph -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-sm">
            <h2 class="text-xl font-semibold text-slate-200 mb-1">Bug Lifecycle Graph</h2>
            <p class="text-slate-400 text-sm mb-4">Visual chart mapping bug status across driver versions (Amber = Open, Green = Fixed)</p>
            
            <div class="relative h-[450px] w-full">
                <canvas id="bugLifecycleChart"></canvas>
            </div>
        </div>

        <div class="grid lg:grid-cols-2 gap-8">
            
            <!-- SECTION 1: Issues Grouped by Driver Version -->
            <div class="space-y-6">
                <h2 class="text-xl font-semibold text-slate-200 border-b border-slate-800 pb-2">Issues by Driver Version</h2>
                <div id="driver-tracker" class="space-y-4 max-h-[800px] overflow-y-auto pr-2"></div>
            </div>

            <!-- SECTION 2: Master Bug Ledger -->
            <div class="space-y-6">
                <h2 class="text-xl font-semibold text-slate-200 border-b border-slate-800 pb-2">Master Bug Ledger</h2>
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-sm max-h-[800px] overflow-y-auto pr-2">
                    <div id="bug-ledger" class="space-y-3"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Fetch external drivers.json cleanly
        fetch('drivers.json')
            .then(response => {
                if (!response.ok) throw new Error('Failed to load drivers.json');
                return response.json();
            })
            .then(data => {
                const driverContainer = document.getElementById('driver-tracker');
                const bugContainer = document.getElementById('bug-ledger');
                
                driverContainer.innerHTML = '';
                bugContainer.innerHTML = '';

                // 1. Render Driver Versions & Their Fixed/Known Bugs
                data.drivers.forEach((d) => {
                    let card = document.createElement('div');
                    card.className = 'bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-sm space-y-4';
                    
                    let fixedHtml = (d.fixed_bug_ids || []).filter(id => data.master_bugs[id]?.trim()).map(id => `
                        <li class="text-emerald-400 text-xs mb-1 flex items-center gap-2">
                            <span class="bg-emerald-950 px-1.5 py-0.5 rounded border border-emerald-800/50 font-mono text-[10px]">${id}</span>
                            <span>${data.master_bugs[id]}</span>
                        </li>
                    `).join('');

                    let knownHtml = (d.known_bug_ids || []).filter(id => data.master_bugs[id]?.trim()).map(id => `
                        <li class="text-amber-400 text-xs mb-1 flex items-center gap-2">
                            <span class="bg-amber-950 px-1.5 py-0.5 rounded border border-amber-800/50 font-mono text-[10px]">${id}</span>
                            <span>${data.master_bugs[id]}</span>
                        </li>
                    `).join('');

                    card.innerHTML = `
                        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                            <div>
                                <span class="text-xl font-bold text-white">${d.version}</span>
                                <span class="ml-2 px-2 py-0.5 rounded text-[10px] font-semibold ${d.type === 'Recommended' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-blue-950 text-blue-400 border border-blue-800'}">${d.type}</span>
                            </div>
                            <div class="text-right">
                                <span class="text-slate-400 text-xs block">${d.date}</span>
                                <a href="${d.url}" target="_blank" class="text-indigo-400 hover:underline text-xs">Release Notes</a>
                            </div>
                        </div>
                        
                        <div class="grid sm:grid-cols-2 gap-3">
                            <div class="bg-slate-950/50 p-3 rounded border border-slate-800/50">
                                <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-500 block mb-2">Fixed in this version</span>
                                <ul class="list-none pl-0">${fixedHtml || '<span class="text-slate-600 text-xs">None</span>'}</ul>
                            </div>
                            <div class="bg-slate-950/50 p-3 rounded border border-slate-800/50">
                                <span class="text-[10px] font-bold uppercase tracking-wider text-amber-500 block mb-2">Known / Open Issues</span>
                                <ul class="list-none pl-0">${knownHtml || '<span class="text-slate-600 text-xs">None</span>'}</ul>
                            </div>
                        </div>
                    `;
                    driverContainer.appendChild(card);
                });

                // 2. Render Master Bug Ledger
                for (const [id, description] of Object.entries(data.master_bugs)) {
                    if (!description.trim()) continue;

                    let isKnownCurrent = data.drivers[0]?.known_bug_ids?.includes(id);
                    let badgeColor = isKnownCurrent ? 'bg-amber-950 text-amber-400 border-amber-800' : 'bg-emerald-950 text-emerald-400 border-emerald-800';
                    let statusText = isKnownCurrent ? 'Open / Pending' : 'Resolved';

                    let bugRow = document.createElement('div');
                    bugRow.className = 'flex items-start justify-between gap-4 py-2 border-b border-slate-800/60 text-xs last:border-0';
                    bugRow.innerHTML = `
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="font-mono font-semibold text-slate-300">${id}</span>
                                <span class="px-1.5 py-0.5 rounded text-[10px] border ${badgeColor}">${statusText}</span>
                            </div>
                            <p class="text-slate-400">${description}</p>
                        </div>
                    `;
                    bugContainer.appendChild(bugRow);
                }

                // 3. Render Visual Chart (Correctly mapped to master bug keys and driver versions)
                const driverVersions = data.drivers.map(d => d.version);
                const activeBugIds = Object.keys(data.master_bugs);

                let chartData = [];
                activeBugIds.forEach((bugId, yIndex) => {
                    driverVersions.forEach((ver, xIndex) => {
                        let driver = data.drivers[xIndex];
                        let status = 0; 

                        if (driver.fixed_bug_ids && driver.fixed_bug_ids.includes(bugId)) {
                            status = 2; // Fixed (Green)
                        } else if (driver.known_bug_ids && driver.known_bug_ids.includes(bugId)) {
                            status = 1; // Open (Amber)
                        }

                        if (status > 0) {
                            chartData.push({
                                x: xIndex,
                                y: yIndex,
                                v: status,
                                bug: bugId,
                                version: ver
                            });
                        }
                    });
                });

                const ctx = document.getElementById('bugLifecycleChart').getContext('2d');
                new Chart(ctx, {
                    type: 'scatter',
                    data: {
                        datasets: [{
                            data: chartData.map(d => ({ x: d.x, y: d.y, v: d.v })),
                            backgroundColor: (context) => {
                                const val = context.raw?.v;
                                return val === 2 ? '#10b981' : '#f59e0b'; // Green vs Amber
                            },
                            pointRadius: 7,
                            pointHoverRadius: 9
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: {
                                type: 'category',
                                labels: driverVersions,
                                ticks: { color: '#94a3b8', font: { family: 'monospace', size: 11 } },
                                grid: { color: '#1e293b' }
                            },
                            y: {
                                type: 'category',
                                labels: activeBugIds,
                                ticks: { color: '#94a3b8', font: { family: 'monospace', size: 11 } },
                                grid: { color: '#1e293b' }
                            }
                        },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        let item = chartData[context.dataIndex];
                                        let state = item.v === 2 ? 'FIXED' : 'OPEN';
                                        return `${item.bug} on ${item.version}: ${state}`;
                                    }
                                }
                            }
                        }
                    }
                });
            })
            .catch(error => console.error('Error loading driver tracker data:', error));
    </script>
</body>
</html>
