name: Auto-Populate AMD Driver

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Full AMD Release Notes URL'
        required: true
        type: string

concurrency:
  group: amd-driver-queue
  cancel-in-progress: false
  queue: max

jobs:
  update-driver:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: |
          python update_drivers.py "${{ github.event.inputs.url }}"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add drivers.json
          git commit -m "Auto-update driver link from GitHub Actions"
          git push
